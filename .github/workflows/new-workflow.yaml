name: New workflow
on:
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        required: true
      name:
        required: false
      size:
        description: Secondary Region Virtual Network Size
        type: choice
        options:
          - small
          - medium
          - large
          - x-small
          - x-large

env:
  environment: ${{ inputs.environment }}
  name: ${{ inputs.name }}
  size: ${{ inputs.size }}

permissions: write-all

jobs:
  set-env-vars:
    runs-on: ubuntu-latest
    steps:
      - name: echo out env vars
        run: |
          echo "ENVIRONMENT=${{ env.environment }}"
          echo "NAME=${{ env.name }}"
          echo "SIZE=${{ env.size }}"

  sub-workflow:
    uses: ./.github/workflows/new-sub-workflow.yaml
    with:
      environment: ${{ inputs.environment }}
      name: ${{ inputs.name }}
      size: ${{ inputs.size }}
